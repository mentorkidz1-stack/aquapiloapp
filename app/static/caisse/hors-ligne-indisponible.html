<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion requise</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #f8f9fa;
    color: #212529;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .carte {
    max-width: 360px;
    text-align: center;
    background: #fff;
    border-radius: 12px;
    padding: 32px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  .icone { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #6c757d; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
  a {
    display: inline-block;
    background: #1f4e79;
    color: #fff;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 15px;
  }
</style>
</head>
<body>
<div class="carte">
  <div class="icone">📶</div>
  <h1>Connexion requise</h1>
  <p>Cette page a besoin d'internet pour s'afficher. Seule la Caisse fonctionne sans connexion. Reconnectez-vous puis réessayez.</p>
  <a href="/ventes/caisse">Aller à la Caisse</a>
</div>

</html>
